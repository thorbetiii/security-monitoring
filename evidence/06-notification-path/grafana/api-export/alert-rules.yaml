              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "sum by (pod) (\r\n  rate(container_cpu_usage_seconds_total{namespace=\"application\", pod=~\"frontend.*\"}[5m])\r\n)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.05
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: Frontend pod {{ $labels.pod }} has increased CPU usage. This may be caused by high request volume, HTTP flood traffic, or endpoint scanning.
            summary: Frontend CPU spike detected
          labels:
            category: resource
            namespace: application
            project: security-monitoring
            scenario: http-flood-endpoint-scanning
            serverity: warning
          isPaused: false
          notification_settings:
            receiver: empty
