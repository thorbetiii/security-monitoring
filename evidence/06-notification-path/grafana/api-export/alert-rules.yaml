apiVersion: 1
groups:
    - orgId: 1
      name: application-metrics
      folder: Security Monitoring Rules
      interval: 30s
      rules:
        - uid: ffnz8wpqy4y68d
          title: Application Pod Not Ready
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "sum by (pod) (\r\n  kube_pod_status_ready{namespace=\"application\", condition=\"true\"}\r\n)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: Pod {{ $labels.pod }} in the application namespace is not ready. This may indicate service failure, overload, or an unstable deployment during testing.
            summary: Application pod is not ready
          labels:
            category: availability
            namespace: application
            project: security-monitoring
            serverity: critical
          isPaused: false
          notification_settings:
            receiver: empty
        - uid: ffnz98hg2lukge
          title: Application Pod Restart Detected
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: "sum by (pod) (\r\n  increase(kube_pod_container_status_restarts_total{namespace=\"application\"}[5m])\r\n)"
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: Pod {{ $labels.pod }} restarted within the last 5 minutes. This may indicate a crash, resource pressure, or instability during abnormal traffic.
            summary: Application pod restarted
          labels:
            category: stability
            namespace: application
            project: security-monitoring
            serverity: warning
          isPaused: false
          notification_settings:
            receiver: empty
        - uid: cfnz9ffcxe1hcb
