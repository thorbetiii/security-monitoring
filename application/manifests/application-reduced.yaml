    project: security-monitoring
    environment: thesis
    layer: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
        project: security-monitoring
        environment: thesis
        layer: application
    spec:
      containers:
        - name: productcatalogservice
          image: security-monitoring/productcatalogservice:thesis
