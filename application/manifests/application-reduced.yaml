apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: application
  labels:
    app: redis-cart
    project: security-monitoring
    environment: thesis
    layer: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
        project: security-monitoring
        environment: thesis
        layer: application
    spec:
      containers:
        - name: redis-cart
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: application
  labels:
    app: redis-cart
    project: security-monitoring
    environment: thesis
    layer: application
spec:
  type: ClusterIP
  selector:
    app: redis-cart
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
