clusterName: opensearch-cluster
nodeGroup: single

singleNode: true
replicas: 1

roles:
  - master
  - ingest
  - data
  - remote_cluster_client

# Persist indices, detector configurations, monitors, notification configurations, anomaly results, and other OpenSearch data.

persistence:
  enabled: true
  enableInitChown: true
  accessModes:
    - ReadWriteOnce
  size: 8Gi

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: true

extraEnvs:
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"

# Load Gmail SMTP credentials from a Kubernetes Secret into the OpenSearch keystore.
keystore: 
  - secretName: opensearch-notification-credentials

service:
  type: ClusterIP
  httpPortName: http
  transportPortName: transport

startupProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10