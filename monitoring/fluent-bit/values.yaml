kind: DaemonSet

serviceAccount:
  create: true

rbac:
  create: true

logLevel: info

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_application_*.log
        Tag kube.*
        Parser cri
        DB /var/log/flb_application_v2.db
        Read_From_Head On
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        Refresh_Interval 5

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log On
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off

  outputs: |
    [OUTPUT]
        Name opensearch
        Match kube.*
        Host opensearch-cluster-single.monitoring.svc.cluster.local
        Port 9200
        Index application-logs
        Suppress_Type_Name On
        Logstash_Format On
        Logstash_Prefix application-logs
        Replace_Dots On
        Retry_Limit False
        tls Off

  customParsers: ""
