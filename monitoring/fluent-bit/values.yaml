kind: DaemonSet

serviceAccount:
  create: true

rbac:
  create: true

logLevel: info

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_application_*.log
        Tag kube.*
        Parser docker
        DB /var/log/flb_application_v2.db
        Read_From_Head On
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        Refresh_Interval 5

  filters: |
    # Enrich each record with Kubernetes metadata.
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log Off
        K8S-Logging.Parser Off
        K8S-Logging.Exclude Off

    # Parse the application JSON contained inside the Docker "log" field.
    [FILTER]
        Name parser
        Match kube.*
        Key_Name log
        Parser application_json
        Reserve_Data On
        Preserve_Key On

  outputs: |
    [OUTPUT]
        Name opensearch
        Match kube.*
        Host opensearch-cluster-single.monitoring.svc.cluster.local
        Port 9200
        Index application-logs
        Suppress_Type_Name On
        Logstash_Format On
        Logstash_Prefix application-logs
        Replace_Dots On
        Retry_Limit False
        tls Off

  customParsers: |
    [PARSER]
        Name application_json
        Format json