name: security-monitoring

services:
  frontend:
    image: security-monitoring/frontend:thesis
    build:
      context: ./src/frontend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      SHOPPING_ASSISTANT_SERVICE_ADDR: shoppingassistantservice:8080
      ENABLE_ASSISTANT: "false"
      ENABLE_PROFILER: "0"
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - shippingservice
      - checkoutservice
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: frontend

  checkoutservice:
    image: security-monitoring/checkoutservice:thesis
    build:
      context: ./src/checkoutservice
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      ENABLE_PROFILER: "0"
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: checkoutservice

  productcatalogservice:
    image: security-monitoring/productcatalogservice:thesis
    build:
      context: ./src/productcatalogservice
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: productcatalogservice

  cartservice:
    image: security-monitoring/cartservice:thesis
    build:
      context: ./src/cartservice/src
    environment:
      PORT: "7070"
      REDIS_ADDR: redis-cart:6379
    depends_on:
      - redis-cart
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: cartservice

  redis-cart:
    image: redis:alpine
    volumes:
      - redis-data:/data
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: redis-cart

  shippingservice:
    image: security-monitoring/shippingservice:thesis
    build:
      context: ./src/shippingservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
      DISABLE_TRACING: "1"
      DISABLE_STATS: "1"
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: shippingservice

  paymentservice:
    image: security-monitoring/paymentservice:thesis
    build:
      context: ./src/paymentservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: paymentservice

  currencyservice:
    image: security-monitoring/currencyservice:thesis
    build:
      context: ./src/currencyservice
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: currencyservice

  emailservice:
    image: security-monitoring/emailservice:thesis
    build:
      context: ./src/emailservice
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"
    labels:
      project: security-monitoring
      environment: thesis
      layer: application
      app: emailservice

volumes:
  redis-data: